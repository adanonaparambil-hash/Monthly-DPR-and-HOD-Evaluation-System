<div [class]="hostClasses" role="status" aria-live="polite" [attr.aria-label]="ariaLabel">

  <!-- ── Tower crane ────────────────────────────────────────────────────────
       Coordinates are fixed in the viewBox; every moving part is a <g> driven
       by a CSS transform. The trolley carries the cable, hook and load, so
       translating the trolley alone moves the whole payload along the jib. -->
  <!-- Decorative: the wrapper above carries the role="status" announcement. -->
  <svg class="cl-svg" viewBox="0 0 200 158" aria-hidden="true"
       xmlns="http://www.w3.org/2000/svg">

    <!-- ground -->
    <line class="cl-ground" x1="8" y1="150" x2="194" y2="150" />

    <!-- foundation block + hazard markings -->
    <rect class="cl-base" x="58" y="139" width="46" height="11" rx="2" />
    <rect class="cl-haz" x="62" y="142.5" width="5" height="5" />
    <rect class="cl-haz" x="72" y="142.5" width="5" height="5" />
    <rect class="cl-haz" x="82" y="142.5" width="5" height="5" />
    <rect class="cl-haz" x="92" y="142.5" width="5" height="5" />

    <!-- mast: two rails + lattice bracing -->
    <rect class="cl-steel" x="74" y="42" width="3" height="97" />
    <rect class="cl-steel" x="87" y="42" width="3" height="97" />
    <path class="cl-web" d="M77 139 L87 121 L77 103 L87 85 L77 67 L87 49" />
    <path class="cl-web" d="M74 121 H90 M74 103 H90 M74 85 H90 M74 67 H90" />

    <!-- slewing platform, A-frame apex and tie bars -->
    <rect class="cl-steel" x="66" y="34" width="32" height="8" rx="2" />
    <path class="cl-web" d="M76 34 L82 9 L88 34" />
    <path class="cl-tie" d="M82 9 L186 25.5" />
    <path class="cl-tie" d="M82 9 L46 25.5" />
    <circle class="cl-beacon" cx="82" cy="6" r="2.6" />

    <!-- counter-jib + counterweight -->
    <rect class="cl-steel" x="44" y="26" width="34" height="3" />
    <rect class="cl-steel" x="44" y="32" width="34" height="2.5" />
    <path class="cl-web" d="M46 32 L54 26 L62 32 L70 26 L78 32" />
    <rect class="cl-weight" x="33" y="23" width="15" height="16" rx="2" />

    <!-- working jib -->
    <rect class="cl-jib" x="94" y="26" width="94" height="3" />
    <rect class="cl-steel" x="94" y="32" width="94" height="2.5" />
    <path class="cl-web"
          d="M96 32 L106 26 L116 32 L126 26 L136 32 L146 26 L156 32 L166 26 L176 32 L186 26" />

    <!-- operator cab -->
    <rect class="cl-cab" x="96" y="35" width="13" height="11" rx="2" />

    <!-- trolley + payload: travels the jib, hoists on the way -->
    <g class="cl-trolley">

      <!-- ground shadow tracks the load horizontally, fades as it lifts -->
      <ellipse class="cl-shadow" cx="113.5" cy="147" rx="17" ry="3.2" />

      <!-- hoist rope: scales from its top anchor as the hook rises -->
      <rect class="cl-cable" x="112.8" y="36" width="1.4" height="62" />

      <rect class="cl-trolley-body" x="106" y="29" width="15" height="7" rx="1.5" />
      <circle class="cl-wheel" cx="109" cy="28.5" r="1.9" />
      <circle class="cl-wheel" cx="118" cy="28.5" r="1.9" />

      <g class="cl-hoist">
        <rect class="cl-hookblk" x="108" y="96" width="11" height="5" rx="1.2" />
        <path class="cl-hook" d="M113.5 101 v4 a3 3 0 1 1 -3 -3" />

        <!-- the load swings on its own, slower rhythm -->
        <g class="cl-load">
          <path class="cl-sling" d="M110 101 L102 107 M117 101 L125 107" />
          <rect class="cl-crate" x="100" y="106" width="27" height="15" rx="2" />
          <rect class="cl-crate-top" x="100" y="106" width="27" height="4.5" rx="2" />
          <path class="cl-strap" d="M108.5 106 v15 M118.5 106 v15" />
        </g>
      </g>
    </g>
  </svg>

  <!-- ── Caption ──────────────────────────────────────────────────────────── -->
  <div class="cl-text">
    <span class="cl-msg">
      {{ message }}<i class="cl-dots"><b>.</b><b>.</b><b>.</b></i>
    </span>
    <span class="cl-sub" *ngIf="sub">{{ sub }}</span>

    <div class="cl-bar" *ngIf="barVisible"><span></span></div>
  </div>

</div>
